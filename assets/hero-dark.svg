  <text class="m eyebrow" x="48" y="86" textLength="335" lengthAdjust="spacing">SOFTWARE ENGINEER · BENGALURU, INDIA</text>
  <text class="m name" x="48" y="140" textLength="449" lengthAdjust="spacing">Shreyansh Sarthak</text>
  <text class="m lede" x="48" y="180" textLength="400" lengthAdjust="spacing">I build systems from the protocol up.</text>
