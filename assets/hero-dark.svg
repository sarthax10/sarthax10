<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 300" width="900" height="300" role="img" aria-label="Shreyansh Sarthak — software engineer in Bengaluru, India. I build systems from the protocol up. Rust, C#, Python.">
  <title>Shreyansh Sarthak — software engineer in Bengaluru, India. I build systems from the protocol up. Rust, C#, Python.</title>
  <defs>
    <radialGradient id="halo" cx="0.82" cy="0.38" r="0.62">
      <stop offset="0" stop-color="#2F6BA8" stop-opacity="0.16"/>
      <stop offset="1" stop-color="#2F6BA8" stop-opacity="0"/>
    </radialGradient>
    <filter id="focusglow" x="-60%" y="-60%" width="220%" height="220%">
      <feDropShadow dx="0" dy="0" stdDeviation="4.5" flood-color="#C99A3F" flood-opacity="0.5"/>
    </filter>
  </defs>
  <style>
    .m{font-family:ui-monospace,"SFMono-Regular","SF Mono","Cascadia Mono","Roboto Mono","Liberation Mono",Menlo,Consolas,monospace}
    .eyebrow{font-size:11.5px;letter-spacing:2.4px;font-weight:500;fill:#7D8A99}
    .name{font-size:44px;font-weight:600;fill:#E9E9E3}
    .lede{font-size:18px;font-weight:500;fill:#C99A3F}
    .sub{font-size:11.5px;letter-spacing:2.4px;font-weight:500;fill:#B9C4CF}
    .tile{fill:#141C26;stroke:#232C38;stroke-width:1}
    .tl{fill:#7D8A99;opacity:.26}
    .tt{fill:#B9C4CF;opacity:.55}
    .lit{fill:#C99A3F;opacity:0}
    .ring{fill:none;stroke:#C99A3F;stroke-width:1.5;opacity:0;filter:url(#focusglow)}
    .caret{fill:#C99A3F;animation:blink 1.15s steps(1,end) infinite}
    .rule{stroke:#C99A3F;stroke-width:1;opacity:.34;stroke-dasharray:804;stroke-dashoffset:804;animation:draw 1.5s .25s cubic-bezier(.22,.61,.36,1) forwards}
    .ring,.lit{animation:focus 13s ease-in-out infinite}
    .lit{animation-name:focusfill}
    #r1,#l1{animation-delay:0.00s}
    #r2,#l2{animation-delay:3.25s}
    #r3,#l3{animation-delay:6.50s}
    #r4,#l4{animation-delay:9.75s}
    @keyframes draw{to{stroke-dashoffset:0}}
    @keyframes blink{0%,48%{opacity:1}52%,100%{opacity:0}}
    @keyframes focus{0%{opacity:0}3%{opacity:1}22%{opacity:1}25%{opacity:0}100%{opacity:0}}
    @keyframes focusfill{0%{opacity:0}3%{opacity:.07}22%{opacity:.07}25%{opacity:0}100%{opacity:0}}
    @media (prefers-reduced-motion:reduce){
      .caret,.ring,.lit,.rule{animation:none}
      .caret{opacity:1} .rule{stroke-dashoffset:0}
      #r1{opacity:1} #l1{opacity:.07}
    }
  </style>

  <rect width="900" height="300" fill="#0D1117"/>
  <rect width="900" height="300" fill="url(#halo)"/>

